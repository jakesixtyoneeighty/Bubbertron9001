name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build production frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate vendored skills
        run: npm run validate:skills

      - name: Verify Studio plugin copies
        run: npm run check:studio-plugin

  rust:
    name: Rust
    # macOS provides Tauri's native framework dependencies without installing
    # Linux WebKit/GTK packages. This job checks code only; it does not bundle.
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
